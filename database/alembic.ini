[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# DATABASE_URL env var overrides this (see migrations/env.py)
sqlalchemy.url = postgresql+psycopg://aquarisk:aquarisk@localhost:5432/aquarisk

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
