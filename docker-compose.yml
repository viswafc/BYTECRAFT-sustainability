services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquarisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquarisk}
      POSTGRES_DB: ${POSTGRES_DB:-aquarisk}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquarisk} -d ${POSTGRES_DB:-aquarisk}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: migrate + seed infrastructure, then exit
  migrate:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    command: sh -c "alembic -c database/alembic.ini upgrade head && python database/seeds/seed_infrastructure.py"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aquarisk}:${POSTGRES_PASSWORD:-aquarisk}@db:5432/${POSTGRES_DB:-aquarisk}
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aquarisk}:${POSTGRES_PASSWORD:-aquarisk}@db:5432/${POSTGRES_DB:-aquarisk}
      TELEMETRY_PROVIDER: ${TELEMETRY_PROVIDER:-database}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
