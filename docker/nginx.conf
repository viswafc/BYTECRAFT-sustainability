map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # WebSocket channels
  location /api/ws/ {
    proxy_pass http://backend:8000/api/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location /api/       { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; }
  location = /health   { proxy_pass http://backend:8000/health; }
  location /docs       { proxy_pass http://backend:8000/docs; }
  location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

  location / { try_files $uri /index.html; }
}
